spring.security.enabled=false
spring.datasource.url=jdbc:h2:mem:wikidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.jwtSecret=super-secret-jwt-key-that-is-at-least-64-characters-long-for-hs512-algorithm-security
app.jwtExpirationInMs=86400000

# Explicitly exclude Spring Security auto-configuration for no-auth profile
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
